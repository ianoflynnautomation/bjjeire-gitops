---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bjj-eire
  namespace: bjjeire-app
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: bjj-eire
  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace
  rollback:
    recreate: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  maxHistory: 3
  valuesFrom:
    - kind: Secret
      name: bjj-azure-ad-secret
      valuesKey: ENTRA_ISSUER_URI
      targetPath: bjj-api.api.env.ENTRA_ISSUER_URI
    - kind: Secret
      name: bjj-azure-ad-secret
      valuesKey: ENTRA_AUDIENCE
      targetPath: bjj-api.api.env.ENTRA_AUDIENCE
    - kind: Secret
      name: bjj-azure-ad-secret
      valuesKey: ENTRA_AUDIENCE_URI
      targetPath: bjj-api.api.env.ENTRA_AUDIENCE_URI
    - kind: Secret
      name: bjj-donation-secret
      valuesKey: DONATION_BITCOIN_ADDRESS
      targetPath: bjj-api.api.env.DONATION_BITCOIN_ADDRESS
  values:
    bjj-mongodb:
      mongodb:
        persistence:
          storageClassName: managed-premium
          size: 32Gi
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
      secrets:
        mongodbRootPassword:
          enabled: true
          create: false
          name: bjj-mongodb-root-password
          key: mongodb-password
    bjj-api:
      api:
        image:
          repository: ghcr.io/ianoflynnautomation/bjjeire-api
          tag: v0.2.0
          pullPolicy: IfNotPresent
        imagePullSecrets:
          - name: ghcr-pull-secret
        serviceAccount:
          create: true
          name: bjjeire-api
          annotations:
            azure.workload.identity/client-id: "${API_CLIENT_ID}"
        replicaCount: 2
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: "/metrics"
          prometheus.io/port: "8080"
        podLabels:
          azure.workload.identity/use: "true"
        jvmOpts: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
        env:
          BJJEIRE_CORS_ALLOWEDORIGINS_0: "https://${CLUSTER_DOMAIN}"
          BJJEIRE_CORS_ALLOWEDORIGINS_1: "https://www.${CLUSTER_DOMAIN}"
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_PERMIT_LIMIT: "5"
          RATE_LIMIT_WINDOW_SECONDS: "10"
          RATE_LIMIT_REJECTION_STATUS_CODE: "429"
          READ_ONLY_MODE_ENABLED: "true"
          FEATURE_BJJ_EVENTS: "true"
          FEATURE_GYMS: "true"
          FEATURE_STORES: "true"
          FEATURE_COMPETITIONS: "true"
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
          OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          targetCPUUtilizationPercentage: 70
        podDisruptionBudget:
          enabled: true
          minAvailable: ""
          maxUnavailable: 1
      secrets:
        mongodbRootPassword:
          enabled: true
          create: false
          name: bjj-mongodb-root-password
          key: mongodb-password
      ingress:
        enabled: false
    bjj-frontend:
      frontend:
        image:
          repository: ghcr.io/ianoflynnautomation/bjjeire-frontend
          tag: v0.1.21
          pullPolicy: IfNotPresent
        imagePullSecrets:
          - name: ghcr-pull-secret
        replicaCount: 2
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 101
          fsGroup: 101
          seccompProfile:
            type: RuntimeDefault
          sysctls:
            - name: net.ipv4.ip_unprivileged_port_start
              value: "0"
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: "/metrics"
          prometheus.io/port: "80"
        env:
          NODE_ENV: production
          PORT: "80"
          SERVICES_API_HTTP_0: "http://bjj-api.bjjeire-app.svc.cluster.local:8080"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 6
          targetCPUUtilizationPercentage: 70
          targetMemoryUtilizationPercentage: 80
        podDisruptionBudget:
          enabled: true
          minAvailable: ""
          maxUnavailable: 1
        waitForApi:
          enabled: true
          apiUrl: "http://bjj-api.bjjeire-app.svc.cluster.local:8080/actuator/health/readiness"
      ingress:
        enabled: false
    seeder:
      enabled: true
      force: false
      environment: Production
      hookPolicy: "post-install"
      image:
        repository: ghcr.io/ianoflynnautomation/bjjeire-seeder
        tag: v0.1.11
        pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccount:
        create: true
        name: bjjeire-seeder
        automount: true
        annotations:
          azure.workload.identity/client-id: "${SEEDER_CLIENT_ID}"
      podLabels:
        azure.workload.identity/use: "true"
      mongodb:
        host: bjj-mongodb
        port: 27017
        user: admin
        database: Mongodb
        secretName: bjj-mongodb-root-password
        secretKey: mongodb-password
