---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:cleanup-controller:bjjeire-namespaces
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
    app.kubernetes.io/component: cleanup-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "delete"]
  # SHA/main acceptance envs are Flux-owned. Reaping the Static
  # ResourceSetInputProvider is what drops the ResourceSet input.
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["resourcesetinputproviders"]
    verbs: ["get", "list", "watch", "delete"]
