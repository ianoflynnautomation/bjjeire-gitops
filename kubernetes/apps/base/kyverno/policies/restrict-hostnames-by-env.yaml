---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-hostnames-by-env
  annotations:
    policies.kyverno.io/title: Restrict HTTPRoute hostnames per environment
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Dev/staging clusters must never claim the public production hostnames.
      Each cluster only allows HTTPRoute hostnames that match its
      ${CLUSTER_DOMAIN} suffix.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: hostnames-must-match-cluster-domain
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - bjjeire-app
                - istio-ingress
                - observability
      validate:
        message: >-
          HTTPRoute hostname must end in "${CLUSTER_DOMAIN}". This blocks dev
          clusters from claiming the public production hostname.
        foreach:
          - list: request.object.spec.hostnames
            deny:
              conditions:
                all:
                  - key: "{{ element }}"
                    operator: NotEquals
                    value: "${CLUSTER_DOMAIN}"
                  - key: "{{ regex_match('^[a-zA-Z0-9*-]+[.-]${CLUSTER_DOMAIN}$', '{{ element }}') }}"
                    operator: Equals
                    value: false
    # Preview/SHA hosts use a single label under ${ROOT_DOMAIN} so Cloudflare
    # Universal SSL (*.${ROOT_DOMAIN}) covers them. Only pr-/sha- prefixes
    # are allowed so this cluster cannot claim www/api/staging.
    - name: ephemeral-hostnames-under-root-domain
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaceSelector:
                matchLabels:
                  bjjeire.io/ephemeral: "true"
      validate:
        message: >-
          Ephemeral HTTPRoute hostname must be pr-|sha-|api-pr-|api-sha- plus
          an id under ${ROOT_DOMAIN} (e.g. pr-80.${ROOT_DOMAIN}).
        foreach:
          - list: request.object.spec.hostnames
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^(pr|sha|api-pr|api-sha)-[a-zA-Z0-9]+.${ROOT_DOMAIN}$', '{{ element }}') }}"
                    operator: Equals
                    value: false
