---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-bjjeire
  namespace: actions-runner-system
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace
  test:
    enable: true
  rollback:
    recreate: true
    force: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  driftDetection:
    mode: warn
  maxHistory: 3
  dependsOn:
    - name: gha-runner-scale-set-controller
      namespace: actions-runner-system
  values:
    nameOverride: gha-runner-scale-set-bjjeire
    runnerScaleSetName: gha-runner-scale-set
    githubConfigSecret: github-app-secret
    githubConfigUrl: https://github.com/ianoflynnautomation/bjjeire
    maxRunners: 4
    minRunners: 0
    controllerServiceAccount:
      name: gha-runner-scale-set-controller
      namespace: actions-runner-system
    # kubernetes-novolume copies the job workspace with container lifecycle
    # hooks instead of a PVC. Azure Disk RWO on the gha-runner pool otherwise
    # caps concurrent jobs at the node's max attached-volume count.
    containerMode:
      type: kubernetes-novolume
    template:
      metadata:
        labels:
          azure.workload.identity/use: "true"
      spec:
        securityContext:
          fsGroup: 123
        serviceAccountName: gha-runner-sa
        imagePullSecrets:
          - name: ghcr-pull-secret
        nodeSelector:
          workload: "gha-runner"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "gha-runner"
            effect: "NoSchedule"
          - key: "kubernetes.azure.com/scalesetpriority"
            operator: "Equal"
            value: "spot"
            effect: "NoSchedule"
        containers:
          - name: runner
            image: ghcr.io/ianoflynnautomation/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_CONTAINER_HOOKS
                value: /home/runner/k8s-novolume/index.js
              - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                value: /home/runner/pod-templates/default.yaml
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: ACTIONS_RUNNER_POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            volumeMounts:
              - name: hook-extension
                mountPath: /home/runner/pod-templates
            securityContext:
              privileged: true
            resources:
              requests:
                memory: "512Mi"
              limits:
                memory: "1Gi"
        volumes:
          - name: hook-extension
            configMap:
              name: gha-runner-hook-extension
