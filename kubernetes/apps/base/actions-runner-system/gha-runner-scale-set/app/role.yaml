---
# Required by ARC containerMode: kubernetes. The runner hook
# (/home/runner/k8s/index.js) creates a Job/Pod (and a Secret) in this
# namespace for each job that specifies `container:`. Custom SAs are not
# granted this by the chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-runner
  namespace: actions-runner-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list"]
