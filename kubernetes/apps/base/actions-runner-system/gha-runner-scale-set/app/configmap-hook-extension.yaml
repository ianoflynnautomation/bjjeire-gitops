---
# Applied to the Playwright/job container ARC creates for `container:`.
# Without requests, kubelet packs 8×~3Gi jobs onto one node and evicts them
# (MemoryPressure). These requests force Pending until there is RAM, instead
# of scheduling then OOM-killing the shard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gha-runner-hook-extension
  namespace: actions-runner-system
data:
  default.yaml: |
    spec:
      # Job pods do NOT inherit the runner pod's scheduling. Without these they
      # land on the apps/system pools, which are arm64 (Dpsv6/Dpdsv5) — and the
      # fs-init init container runs the amd64-only runner image, so the pull
      # fails with "no match for platform in manifest". Keep in lockstep with
      # the template.spec in the gha-runner-scale-set HelmReleases.
      nodeSelector:
        workload: "gha-runner"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "gha-runner"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      containers:
        - name: "$job"
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
