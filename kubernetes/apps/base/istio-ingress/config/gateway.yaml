---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress
  annotations:
    external-dns.alpha.kubernetes.io/external: "true"
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      # Do not publish ${CLUSTER_DOMAIN} / *.${CLUSTER_DOMAIN} via external-dns.
      # Terraform module.cloudflare_tunnel owns those names as CNAMEs to
      # <tunnel-id>.cfargotunnel.com. Publishing A records at the Istio
      # LoadBalancer IP makes Cloudflare reject the CNAME create (81053).
      service.beta.kubernetes.io/port_80_health-probe_protocol: Tcp
      service.beta.kubernetes.io/port_443_health-probe_protocol: Tcp
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.${CLUSTER_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-root
      port: 80
      protocol: HTTP
      hostname: "${CLUSTER_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-wildcard
      port: 443
      protocol: HTTPS
      hostname: "*.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls-secret
            namespace: network-system
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: https-root
      port: 443
      protocol: HTTPS
      hostname: "${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls-secret
            namespace: network-system
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    # Single-label names under the zone apex (pr-80.bjjeire.com, sha-*.bjjeire.com).
    # Cloudflare Universal SSL covers *.${ROOT_DOMAIN} but not *.${CLUSTER_DOMAIN}.
    - name: https-apex-wildcard
      port: 443
      protocol: HTTPS
      hostname: "*.${ROOT_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls-secret
            namespace: network-system
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
