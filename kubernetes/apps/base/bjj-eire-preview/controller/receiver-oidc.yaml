---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: bjj-eire-preview-oidc
  namespace: flux-system
spec:
  type: generic-oidc
  oidcProviders:
    - issuerURL: https://token.actions.githubusercontent.com
      audience: notification-controller
      validations:
        - expression: "claims.repository == 'ianoflynnautomation/bjjeire'"
          message: "repository not allowed"
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: bjj-eire-prs
      namespace: flux-system
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: bjj-eire-previews
      namespace: flux-system
