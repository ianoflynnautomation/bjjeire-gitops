---
# Requires Flux 2.9+ (notification-controller Receiver CRD with spec.oidcProviders).
# Not listed in kustomization.yaml while the cluster is on Flux 2.8.8
# (flux-operator-manifests v0.52.0). Re-add the file to resources after
# upgrading the operator manifests artifact to >= v0.53.0.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: bjj-eire-preview-oidc
  namespace: flux-system
spec:
  type: generic-oidc
  events:
    - push
  oidcProviders:
    - issuerURL: https://token.actions.githubusercontent.com
      audience: flux-notification-controller
      validations:
        - expression: "claims.repository == 'ianoflynnautomation/BjjEire' || claims.repository == 'ianoflynnautomation/bjjeire-java'"
          message: "repository not allowed"
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: bjj-eire-prs
      namespace: flux-system
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: bjj-eire-previews
      namespace: flux-system
