---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: bjj-eire-prs
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - pull_request
  secretRef:
    name: flux-preview-webhook
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: bjj-eire-prs
      namespace: flux-system
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: bjj-eire-previews
      namespace: flux-system
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: bjj-eire-preview-oidc
  namespace: flux-system
spec:
  type: generic-oidc
  events:
    - push
  oidcProviders:
    - issuerURL: https://token.actions.githubusercontent.com
      audience: flux-notification-controller
      validations:
        - "claims.repository == 'ianoflynnautomation/BjjEire' || claims.repository == 'ianoflynnautomation/bjjeire-java'"
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: bjj-eire-prs
      namespace: flux-system
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: bjj-eire-previews
      namespace: flux-system
