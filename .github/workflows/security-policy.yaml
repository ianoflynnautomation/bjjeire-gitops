---
name: Security Policy

on:
  pull_request:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/security-policy.yaml"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/security-policy.yaml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Kustomize
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/setup-kubernetes-tools@v1
        with:
          kustomize-version: "5.5.0"

      - name: Render cluster overlays
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/kustomize-render@v1
        with:
          paths: |
            kubernetes/apps/overlays/*
          output-dir: rendered

      - name: Upload rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rendered-manifests-scan
          path: rendered/
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Security Scans
    needs: render
    permissions:
      contents: read
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/kubernetes-policy-scan.yml@v1
    with:
      manifests-artifact: rendered-manifests-scan
      trivy-severity: HIGH,CRITICAL
      polaris-min-score: 80
      runs-on: ubuntu-24.04
      timeout-minutes: 25
