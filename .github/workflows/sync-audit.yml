---
name: Sync audit

# Fail-loud drift detector: for every environment overlay, assert that the
# umbrella chart tag (OCIRepository) and every image tag it pins actually exist
# as published artifacts in GHCR. Catches the two classes of drift that bit us:
#   - OCIRepository tag pointing at a chart version never published (e.g. 0.1.11)
#   - overlay image tag pinned to an image tag that doesn't exist
#
# The registry probing lives in the shared oci-tag-audit action. Extracting the
# pins is repo-specific glue and stays here — it depends on this repo's overlay
# layout and Helm values structure.
#
# Charts are public (anonymous pull). Images are private: GITHUB_TOKEN works when
# the packages grant this repo read access; otherwise swap to the bjjeire App
# token (packages: read across the owner).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - "kubernetes/apps/overlays/**/bjj-eire/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: sync-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit chart & image tags vs GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Collect pinned chart and image tags
        id: pins
        env:
          CHART_REPO: bjj-eire
        run: |
          set -euo pipefail
          artifacts='[]'

          add() {
            artifacts="$(printf '%s' "$artifacts" | jq -c \
              --arg name "$1" --arg repo "$2" --arg tag "$3" --arg file "$4" \
              '. + [{name: $name, repository: $repo, tag: $tag, file: $file}]')"
          }

          shopt -s nullglob
          for overlay in kubernetes/apps/overlays/*/bjj-eire; do
            env_name="$(basename "$(dirname "$overlay")")"
            ks="$overlay/kustomization.yaml"
            img="$overlay/helmrelease-images.yaml"
            [ -f "$ks" ] || continue

            chart_tag="$(yq '.patches[] | select(.target.kind == "OCIRepository") | .patch' "$ks" \
              | yq '.[0].value.tag' -)"
            add "chart [${env_name}]" "${GITHUB_REPOSITORY_OWNER}/${CHART_REPO}" "$chart_tag" "$ks"

            if [ -f "$img" ]; then
              add "api [${env_name}]"      "${GITHUB_REPOSITORY_OWNER}/bjjeire-api" \
                  "$(yq '.spec.values.bjj-api.api.image.tag' "$img")" "$img"
              add "frontend [${env_name}]" "${GITHUB_REPOSITORY_OWNER}/bjjeire-frontend" \
                  "$(yq '.spec.values.bjj-frontend.frontend.image.tag' "$img")" "$img"
              add "seeder [${env_name}]"   "${GITHUB_REPOSITORY_OWNER}/bjjeire-seeder" \
                  "$(yq '.spec.values.seeder.image.tag' "$img")" "$img"
            fi
          done

          echo "artifacts=${artifacts}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Sync audit::Collected $(printf '%s' "$artifacts" | jq 'length') pinned reference(s)"

      - name: Audit tags against GHCR
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/oci-tag-audit@v1
        with:
          artifacts: ${{ steps.pins.outputs.artifacts }}
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}
          summary-title: Sync audit result
