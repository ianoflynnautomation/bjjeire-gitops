---
name: YAML Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/lint-workflows.yml@v1
    with:
      yamllint: true
      yamllint-paths: "kubernetes/ .github/workflows/"
      yamllint-strict: true
      yamllint-config-data: |
        extends: default
        rules:
          line-length:
            max: 200
            level: warning
            # Embedded Grafana dashboard JSON — long lines are unavoidable
            # inside the json: | block and cannot be wrapped.
            ignore: |
              kubernetes/apps/base/observability/grafana/instance/grafanadashboard-acceptance-tests.yaml
          comments:
            min-spaces-from-content: 1
          truthy:
            check-keys: false
          document-start:
            present: true
          indentation:
            spaces: 2
            indent-sequences: true
      zizmor-enforce: false
      runs-on: ubuntu-24.04
