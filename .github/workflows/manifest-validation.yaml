---
name: Manifest Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/manifest-validation.yaml"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/manifest-validation.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/kubernetes-manifest-validation.yml@v1
    with:
      overlay-paths: |
        kubernetes/apps/overlays/*
      kubernetes-version: "1.31.0"
      flux-version: "2.8.8"
      kustomize-version: "5.5.0"
      kubeconform-version: "0.6.7"
      helm-version: "3.17.0"
      helm-lint-path: kubernetes
      deny-pattern: 'url:[[:space:]]*oci://.+:latest([[:space:]]|$)'
      deny-pattern-path: kubernetes
      deny-pattern-title: Mutable OCI reference
      report-pattern: 'url:[[:space:]]*oci://'
      report-pattern-path: kubernetes
      report-pattern-title: OCI refs
      runs-on: ubuntu-24.04
      timeout-minutes: 20
