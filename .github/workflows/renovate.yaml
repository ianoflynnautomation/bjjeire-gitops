---
name: Renovate

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options:
          - info
          - debug
          - warn
      dry_run:
        description: Log-only dry run (no PR/commit writes)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/renovate.yml@v1
    with:
      config-file: renovate.json
      log-level: ${{ inputs.log_level || 'info' }}
      dry-run: ${{ inputs.dry_run || false }}
      host-rules: |
        [
          {
            "matchHost": "ghcr.io",
            "hostType": "docker",
            "username": "x-access-token",
            "password": "${RENOVATE_HOST_TOKEN}"
          }
        ]
      runs-on: ubuntu-24.04
      timeout-minutes: 30
    secrets:
      renovate-token: ${{ secrets.RENOVATE_TOKEN }}
