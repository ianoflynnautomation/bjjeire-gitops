---
name: Flux Local

on:
  pull_request:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/flux-local.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-local:
    name: Flux Local
    permissions:
      contents: read
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/flux-local.yml@v1
    with:
      cluster-paths: >-
        ["kubernetes/clusters/aks-bjjeire-dev-sdc-01",
         "kubernetes/clusters/aks-bjjeire-stg-sdc-01",
         "kubernetes/clusters/aks-bjjeire-prod-sdc-01"]
      runs-on: ubuntu-24.04
      test-timeout-minutes: 15
      diff-timeout-minutes: 10
